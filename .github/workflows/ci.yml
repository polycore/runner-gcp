name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Test deploy Action
        run: tests/action.test.sh

      - name: Test COS startup script
        run: |
          bash -n terraform/vm-startup.sh
          tests/vm-startup.test.sh

      - name: Test standalone VM deployment
        run: |
          bash -n .github/actions/deploy-runner-gcp-vm/vm-startup.sh
          python3 -m unittest discover -s tests -v
          tests/vm-action.test.sh

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
