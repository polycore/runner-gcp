name: Deploy Polycore runner (GCP)
description: >
  Build and push an immutable runner version, move the live tag to that digest,
  and roll the Terraform-managed runner MIG.

inputs:
  project:
    description: GCP project that hosts the MIG and Artifact Registry
    required: true
  zone:
    description: Zone of the Terraform-managed runner MIG
    required: false
    default: europe-west1-b
  image:
    description: Full Artifact Registry image repository without a tag
    required: true
  version:
    description: Immutable Docker version tag for this release
    required: true
  runner_name:
    description: Terraform-managed MIG name
    required: false
    default: polycore-runner
  integration_dir:
    description: Docker build context containing the runner code
    required: true
  dockerfile:
    description: Dockerfile path relative to integration_dir
    required: false
    default: Dockerfile
  build_secret_env:
    description: Optional env var passed as Docker BuildKit secret id=node_auth_token
    required: false
    default: ""

outputs:
  digest:
    description: Digest promoted to the live tag
    value: ${{ steps.release.outputs.digest }}
  version_image:
    description: Immutable versioned image reference
    value: ${{ steps.release.outputs.version_image }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        RUNNER_NAME: ${{ inputs.runner_name }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ "${IMAGE}" == *:* || "${IMAGE}" == *@* ]]; then
          echo "error: image must not include a tag or digest" >&2
          exit 1
        fi
        if [[ ! "${VERSION}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "error: version must be a valid Docker tag" >&2
          exit 1
        fi
        if [[ "${VERSION}" == "live" ]]; then
          echo "error: version must be immutable and cannot be live" >&2
          exit 1
        fi
        if [[ ! "${RUNNER_NAME}" =~ ^[a-z]([-a-z0-9]*[a-z0-9])?$ ]]; then
          echo "error: runner_name must be a valid GCE name" >&2
          exit 1
        fi

    - name: Configure Docker for Artifact Registry
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        REGISTRY_HOST="${IMAGE%%/*}"
        gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

    - name: Build and push immutable runner version
      shell: bash
      working-directory: ${{ inputs.integration_dir }}
      env:
        BUILD_SECRET_ENV: ${{ inputs.build_secret_env }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION_IMAGE="${IMAGE}:${VERSION}"
        DOCKER_ARGS=(build --platform=linux/amd64 -f "${DOCKERFILE}" -t "${VERSION_IMAGE}")
        if [[ -n "${BUILD_SECRET_ENV}" ]]; then
          if [[ -z "${!BUILD_SECRET_ENV:-}" ]]; then
            echo "error: build_secret_env=${BUILD_SECRET_ENV} is set but that env var is empty" >&2
            exit 1
          fi
          DOCKER_ARGS+=(--secret "id=node_auth_token,env=${BUILD_SECRET_ENV}")
        fi
        DOCKER_ARGS+=(.)
        docker "${DOCKER_ARGS[@]}"
        docker push "${VERSION_IMAGE}"

    - name: Promote version to live
      id: release
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION_IMAGE="${IMAGE}:${VERSION}"
        DIGEST="$(gcloud artifacts docker images describe "${VERSION_IMAGE}" --format='value(image_summary.digest)')"
        if [[ -z "${DIGEST}" ]]; then
          echo "error: could not resolve the pushed image digest" >&2
          exit 1
        fi
        gcloud artifacts docker tags add "${IMAGE}@${DIGEST}" "${IMAGE}:live" --quiet
        {
          echo "digest=${DIGEST}"
          echo "version_image=${VERSION_IMAGE}"
        } >> "${GITHUB_OUTPUT}"

    - name: Roll runner MIG
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        RUNNER_NAME: ${{ inputs.runner_name }}
        ZONE: ${{ inputs.zone }}
      run: |
        set -euo pipefail
        if ! gcloud compute instance-groups managed describe "${RUNNER_NAME}" \
          --project="${PROJECT}" --zone="${ZONE}" >/dev/null 2>&1; then
          echo "error: MIG ${RUNNER_NAME} not found; apply the Terraform module first" >&2
          exit 1
        fi
        gcloud compute instance-groups managed rolling-action replace "${RUNNER_NAME}" \
          --project="${PROJECT}" --zone="${ZONE}" \
          --replacement-method=substitute \
          --max-surge=1 --max-unavailable=0 --min-ready=30s
        gcloud compute instance-groups managed wait-until "${RUNNER_NAME}" \
          --project="${PROJECT}" --zone="${ZONE}" --stable --timeout=900
        HEALTH="$(gcloud compute instance-groups managed list-instances "${RUNNER_NAME}" \
          --project="${PROJECT}" --zone="${ZONE}" \
          --format='value(instanceHealth[0].detailedHealthState)')"
        if [[ "${HEALTH}" != "HEALTHY" ]]; then
          echo "error: runner MIG did not become healthy (state: ${HEALTH:-unknown})" >&2
          exit 1
        fi
