name: Deploy Polycore runner (GCP)
description: >
  Build and push a customer runner image, then provision, roll out, or tear
  down the always-on GCE VM. Caller must authenticate to GCP first
  (e.g. google-github-actions/auth).

inputs:
  mode:
    description: provision | rollout | teardown
    required: true
  project:
    description: GCP project id that hosts the VM and Artifact Registry
    required: true
  region:
    description: Artifact Registry / VM region
    required: false
    default: europe-west1
  zone:
    description: GCE zone for the runner VM
    required: false
    default: europe-west1-b
  image:
    description: Full image ref to build/push (e.g. REGION-docker.pkg.dev/PROJECT/polycore/runner:latest)
    required: true
  runner_id:
    description: Control-plane runner id (rnr_…)
    required: true
  project_slug:
    description: Polycore project slug this runner serves (POLYCORE_PROJECT_SLUG)
    required: true
  integration_dir:
    description: Path to the customer integration package (Dockerfile + polycore.json + actions)
    required: true
  control_plane_ws:
    description: Control-plane WebSocket URL
    required: false
    default: wss://cp.polycore.ai/runner
  runner_config_path:
    description: Path to polycore.json inside the image
    required: false
    default: /app/integration/polycore.json
  vm_name:
    description: GCE instance name
    required: false
    default: polycore-runner
  container_name:
    description: Docker container name on the VM
    required: false
    default: polycore-runner
  machine_type:
    description: GCE machine type (provision only)
    required: false
    default: e2-micro
  dockerfile:
    description: Dockerfile path relative to integration_dir
    required: false
    default: Dockerfile
  build_secret_env:
    description: Optional env var name passed as Docker BuildKit secret id=node_auth_token (e.g. NODE_AUTH_TOKEN)
    required: false
    default: ""
  extra_secrets:
    description: >
      Optional JSON array of {"secret":"SECRET_ID","env":"ENV_VAR"} for secrets
      fetched on the VM and injected into the container
    required: false
    default: "[]"
  extra_env:
    description: Optional JSON object of plain env bindings injected into the container
    required: false
    default: "{}"

runs:
  using: composite
  steps:
    - name: Validate mode
      shell: bash
      run: |
        case "${{ inputs.mode }}" in
          provision|rollout|teardown) ;;
          *)
            echo "error: mode must be provision, rollout, or teardown" >&2
            exit 1
            ;;
        esac
        if [ -z "${{ inputs.runner_id }}" ]; then
          echo "error: runner_id is required" >&2
          exit 1
        fi

    - name: Configure Docker for Artifact Registry
      if: ${{ inputs.mode != 'teardown' }}
      shell: bash
      run: gcloud auth configure-docker "${{ inputs.region }}-docker.pkg.dev" --quiet

    - name: Build and push runner image
      if: ${{ inputs.mode != 'teardown' }}
      shell: bash
      working-directory: ${{ inputs.integration_dir }}
      env:
        BUILD_SECRET_ENV: ${{ inputs.build_secret_env }}
      run: |
        set -euo pipefail
        DOCKER_ARGS=(
          build
          --platform=linux/amd64
          -f "${{ inputs.dockerfile }}"
          -t "${{ inputs.image }}"
        )
        if [ -n "${BUILD_SECRET_ENV}" ]; then
          if [ -z "${!BUILD_SECRET_ENV:-}" ]; then
            echo "error: build_secret_env=${BUILD_SECRET_ENV} is set but that env var is empty" >&2
            exit 1
          fi
          DOCKER_ARGS+=(--secret "id=node_auth_token,env=${BUILD_SECRET_ENV}")
        fi
        DOCKER_ARGS+=(.)
        docker "${DOCKER_ARGS[@]}"
        docker push "${{ inputs.image }}"

    - name: Resolve project number and VM SA
      if: ${{ inputs.mode != 'teardown' }}
      id: gcp
      shell: bash
      run: |
        set -euo pipefail
        PROJECT_NUMBER="$(gcloud projects describe "${{ inputs.project }}" --format='value(projectNumber)')"
        echo "project_number=${PROJECT_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "vm_sa=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" >> "$GITHUB_OUTPUT"

    - name: Build instance metadata
      if: ${{ inputs.mode != 'teardown' }}
      id: meta
      shell: bash
      env:
        EXTRA_SECRETS: ${{ inputs.extra_secrets }}
        EXTRA_ENV: ${{ inputs.extra_env }}
        RUNNER_HOME: ${{ runner.temp }}/polycore-runner-meta
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_HOME}"
        # JSON goes in metadata files (comma-separated --metadata cannot hold JSON).
        python3 -c 'import json,sys; json.dump(json.loads(sys.argv[1]), open(sys.argv[2],"w"), separators=(",",":"))' \
          "${EXTRA_SECRETS}" "${RUNNER_HOME}/extra-secrets"
        python3 -c 'import json,sys; json.dump(json.loads(sys.argv[1]), open(sys.argv[2],"w"), separators=(",",":"))' \
          "${EXTRA_ENV}" "${RUNNER_HOME}/extra-env"
        METADATA="host-project=${{ inputs.project }},\
runner-image=${{ inputs.image }},\
control-plane-ws=${{ inputs.control_plane_ws }},\
runner-id=${{ inputs.runner_id }},\
runner-config-path=${{ inputs.runner_config_path }},\
polycore-project-slug=${{ inputs.project_slug }},\
google-cloud-project=${{ inputs.project }},\
container-name=${{ inputs.container_name }},\
secret-join-token=POLYCORE_JOIN_TOKEN,\
secret-signing-secret=POLYCORE_SIGNING_SECRET"
        {
          echo "metadata<<EOF"
          echo "${METADATA}"
          echo "EOF"
          echo "meta_dir=${RUNNER_HOME}"
        } >> "$GITHUB_OUTPUT"

    - name: Provision runner VM
      if: ${{ inputs.mode == 'provision' }}
      shell: bash
      env:
        STARTUP_SCRIPT: ${{ github.action_path }}/vm-startup.sh
        METADATA: ${{ steps.meta.outputs.metadata }}
        META_DIR: ${{ steps.meta.outputs.meta_dir }}
        VM_SA: ${{ steps.gcp.outputs.vm_sa }}
      run: |
        set -euo pipefail
        FROM_FILE="startup-script=${STARTUP_SCRIPT},extra-secrets=${META_DIR}/extra-secrets,extra-env=${META_DIR}/extra-env"
        if gcloud compute instances describe "${{ inputs.vm_name }}" \
          --zone="${{ inputs.zone }}" --project="${{ inputs.project }}" >/dev/null 2>&1; then
          echo "VM ${{ inputs.vm_name }} already exists; applying rollout instead"
          gcloud compute instances add-metadata "${{ inputs.vm_name }}" \
            --zone="${{ inputs.zone }}" \
            --project="${{ inputs.project }}" \
            --metadata="${METADATA}" \
            --metadata-from-file="${FROM_FILE}"
          gcloud compute instances reset "${{ inputs.vm_name }}" \
            --zone="${{ inputs.zone }}" --project="${{ inputs.project }}"
          exit 0
        fi
        gcloud compute instances create "${{ inputs.vm_name }}" \
          --project="${{ inputs.project }}" \
          --zone="${{ inputs.zone }}" \
          --machine-type="${{ inputs.machine_type }}" \
          --image-family=debian-12 \
          --image-project=debian-cloud \
          --boot-disk-size=20GB \
          --scopes=cloud-platform \
          --service-account="${VM_SA}" \
          --metadata="${METADATA}" \
          --metadata-from-file="${FROM_FILE}"

    - name: Roll out runner VM
      if: ${{ inputs.mode == 'rollout' }}
      shell: bash
      env:
        STARTUP_SCRIPT: ${{ github.action_path }}/vm-startup.sh
        METADATA: ${{ steps.meta.outputs.metadata }}
        META_DIR: ${{ steps.meta.outputs.meta_dir }}
      run: |
        set -euo pipefail
        if ! gcloud compute instances describe "${{ inputs.vm_name }}" \
          --zone="${{ inputs.zone }}" --project="${{ inputs.project }}" >/dev/null 2>&1; then
          echo "error: VM ${{ inputs.vm_name }} not found; run mode=provision first" >&2
          exit 1
        fi
        FROM_FILE="startup-script=${STARTUP_SCRIPT},extra-secrets=${META_DIR}/extra-secrets,extra-env=${META_DIR}/extra-env"
        gcloud compute instances add-metadata "${{ inputs.vm_name }}" \
          --zone="${{ inputs.zone }}" \
          --project="${{ inputs.project }}" \
          --metadata="${METADATA}" \
          --metadata-from-file="${FROM_FILE}"
        gcloud compute instances reset "${{ inputs.vm_name }}" \
          --zone="${{ inputs.zone }}" --project="${{ inputs.project }}"

    - name: Tear down runner VM
      if: ${{ inputs.mode == 'teardown' }}
      shell: bash
      run: |
        set -euo pipefail
        if gcloud compute instances describe "${{ inputs.vm_name }}" \
          --zone="${{ inputs.zone }}" --project="${{ inputs.project }}" >/dev/null 2>&1; then
          gcloud compute instances delete "${{ inputs.vm_name }}" \
            --zone="${{ inputs.zone }}" --project="${{ inputs.project }}" --quiet
          echo "Deleted ${{ inputs.vm_name }}."
        else
          echo "VM ${{ inputs.vm_name }} not found; nothing to do."
        fi
